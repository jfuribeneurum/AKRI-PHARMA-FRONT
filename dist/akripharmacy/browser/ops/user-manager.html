<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de usuarios</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip info">Usuarios</span><h1>Gestor de usuarios</h1><p>Creación, modificación, activación y desactivación de usuarios con filtros avanzados por sede y perfil, y edición en panel lateral sin perder la lista principal.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=users&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:users">Dashboard</a></div></div><div id="app"></div><script>
requireSession();
const { api, html, escapeHtml, formatDate, notifyParentHeight, modalShell, toast, number } = window.akriOps;
const app = document.getElementById('app');
let ctx = null, lookups = null, users = [], filters = { search:'', id_sede:'', id_rol:'', active:'' }, editing = null;
async function load(){ [ctx, lookups, users] = await Promise.all([api('/api/multisite/context'), api('/api/admin/lookups'), fetchUsers()]); render(); }
async function fetchUsers(){ return api(`/api/admin/users?search=${encodeURIComponent(filters.search)}&id_sede=${encodeURIComponent(filters.id_sede)}&id_rol=${encodeURIComponent(filters.id_rol)}&active=${encodeURIComponent(filters.active)}`); }
function blankUser(){ return { id_usuario:null, username:'', password:'', nombre:'', apellido_paterno:'', apellido_materno:'', email:'', telefono_movil:'', id_rol:'', id_sede:'', id_almacen_principal:'', numero_empleado:'', cedula_profesional:'', fecha_ingreso:'', turno:'matutino', es_activo:true, requiere_cambio_password:false, site_ids:[], puede_admin_sede:false }; }
function openForm(user=null){ editing = user ? { ...blankUser(), ...user, password:'', site_ids:(user.access||[]).map(a=>Number(a.id_sede)), puede_admin_sede:(user.access||[]).some(a=>a.puede_admin_sede), id_rol:String(user.id_rol), id_sede:String(user.id_sede), id_almacen_principal:user.id_almacen_principal ? String(user.id_almacen_principal):'' } : blankUser(); render(); setTimeout(bindSlide,20); }
function closeForm(){ editing = null; render(); }
function badgeForRole(role=''){ const text = String(role||'').toLowerCase(); if(text.includes('admin')) return 'primary'; if(text.includes('aud')) return 'accent'; if(text.includes('regente')||text.includes('quim')) return 'success'; return 'info'; }
async function saveUser(){
  try{
    const payload = { username:editing.username, nombre:editing.nombre, apellido_paterno:editing.apellido_paterno, apellido_materno:editing.apellido_materno || null, email:editing.email, telefono_movil:editing.telefono_movil || null, id_rol:Number(editing.id_rol), id_sede:Number(editing.id_sede), id_almacen_principal:editing.id_almacen_principal ? Number(editing.id_almacen_principal) : null, numero_empleado:editing.numero_empleado || null, cedula_profesional:editing.cedula_profesional || null, fecha_ingreso:editing.fecha_ingreso || null, turno:editing.turno || 'matutino', es_activo:Boolean(editing.es_activo), requiere_cambio_password:Boolean(editing.requiere_cambio_password), site_ids:(editing.site_ids || []).map(Number), puede_admin_sede:Boolean(editing.puede_admin_sede) };
    if(!editing.id_usuario) payload.password = editing.password;
    if(!payload.username || !payload.nombre || !payload.apellido_paterno || !payload.email || !payload.id_rol || !payload.id_sede) throw new Error('Completa los campos obligatorios del usuario.');
    if(!editing.id_usuario && (!payload.password || payload.password.length < 6)) throw new Error('La contraseña inicial debe tener al menos 6 caracteres.');
    if(editing.id_usuario) await api(`/api/admin/users/${editing.id_usuario}`, { method:'PUT', body: JSON.stringify(payload) });
    else await api('/api/admin/users', { method:'POST', body: JSON.stringify(payload) });
    toast(editing.id_usuario ? 'Usuario actualizado' : 'Usuario creado', 'success');
    editing = null; users = await fetchUsers(); render();
  }catch(error){ toast(error.message,'error',5000); }
}
async function changeState(user, active){
  try{
    if(active) await api(`/api/admin/users/${user.id_usuario}`, { method:'PUT', body: JSON.stringify({ es_activo:true }) });
    else await api(`/api/admin/users/${user.id_usuario}`, { method:'DELETE' });
    toast(active ? 'Usuario reactivado' : 'Usuario desactivado', 'success');
    users = await fetchUsers(); render();
  }catch(error){ toast(error.message,'error',5200); }
}
function auditUser(user){
  const content = `<div class="modal-head"><div><span class="chip info">Accesos autorizados</span><h2 style="margin:.35rem 0 0">${escapeHtml(user.nombre_completo || user.username)}</h2></div><button class="btn secondary" id="closeModal">Cerrar</button></div>
    <div class="cards-grid">${(user.access||[]).map((access)=> `<div class="site-card"><strong>${escapeHtml(access.nombre)}</strong><div class="muted">${access.es_predeterminada ? 'Sede predeterminada' : 'Sede adicional'}</div><div class="muted">${access.puede_admin_sede ? 'Admin de sede' : 'Acceso operativo'}</div></div>`).join('') || '<div class="notice">Este usuario no tiene sedes autorizadas.</div>'}</div>`;
  const modal = modalShell(content); modal.querySelector('#closeModal').onclick = ()=> modal.remove();
}
function bindFilters(){ document.getElementById('flt-search').oninput=(e)=> filters.search=e.target.value; document.getElementById('flt-site').onchange=(e)=> filters.id_sede=e.target.value; document.getElementById('flt-role').onchange=(e)=> filters.id_rol=e.target.value; document.getElementById('flt-active').onchange=(e)=> filters.active=e.target.value; document.getElementById('applyFilters').onclick=async()=>{ users=await fetchUsers(); render(); }; document.getElementById('newUser').onclick=()=> openForm(); }
function bindTable(){ document.querySelectorAll('[data-edit-user]').forEach((btn)=> btn.onclick=()=> openForm(users.find(u=>Number(u.id_usuario)===Number(btn.dataset.editUser)))); document.querySelectorAll('[data-audit-user]').forEach((btn)=> btn.onclick=()=> auditUser(users.find(u=>Number(u.id_usuario)===Number(btn.dataset.auditUser)))); document.querySelectorAll('[data-state-user]').forEach((btn)=> btn.onclick=()=> changeState(users.find(u=>Number(u.id_usuario)===Number(btn.dataset.stateUser)), btn.dataset.nextState === 'true')); notifyParentHeight(); }
function bindSlide(){ if(!editing) return; ['username','password','nombre','apellido_paterno','apellido_materno','email','telefono_movil','numero_empleado','cedula_profesional','fecha_ingreso'].forEach((key)=>{ const el=document.getElementById(`usr-${key}`); if(el) el.oninput=(e)=> editing[key]=e.target.value; }); ['id_rol','id_sede','id_almacen_principal','turno'].forEach((key)=>{ const el=document.getElementById(`usr-${key}`); if(el) el.onchange=(e)=> editing[key]=e.target.value; }); document.getElementById('usr-activo').onchange=(e)=> editing.es_activo=e.target.checked; document.getElementById('usr-force').onchange=(e)=> editing.requiere_cambio_password=e.target.checked; document.getElementById('usr-admin-sede').onchange=(e)=> editing.puede_admin_sede=e.target.checked; document.querySelectorAll('[data-user-site]').forEach((el)=> el.onchange=()=> editing.site_ids=[...document.querySelectorAll('[data-user-site]:checked')].map(x=> Number(x.value))); document.getElementById('closeSlide').onclick=closeForm; document.getElementById('saveUser').onclick=saveUser; }
function slideForm(){ if(!editing) return ''; const roleOptions=(lookups.roles||[]).map((row)=> `<option value="${row.id_rol}" ${String(row.id_rol)===String(editing.id_rol)?'selected':''}>${escapeHtml(row.nombre)}</option>`).join(''); const siteOptions=(lookups.sites||[]).map((row)=> `<option value="${row.id_sede}" ${String(row.id_sede)===String(editing.id_sede)?'selected':''}>${escapeHtml(row.nombre)}</option>`).join(''); const whOptions=(lookups.warehouses||[]).filter((row)=> !editing.id_sede || Number(row.id_sede)===Number(editing.id_sede)).map((row)=> `<option value="${row.id_almacen}" ${String(row.id_almacen)===String(editing.id_almacen_principal)?'selected':''}>${escapeHtml(row.nombre)} · ${escapeHtml(row.sede)}</option>`).join(''); return `<div class="slide-over-backdrop" id="slideBackdrop"></div><aside class="slide-over"><div class="drawer-head"><div><span class="chip info">Usuario</span><h2 style="margin:.35rem 0 0">${editing.id_usuario ? 'Editar usuario' : 'Crear usuario'}</h2></div><button class="btn secondary" id="closeSlide">Cerrar</button></div><div class="form-grid"><div><label>Username</label><input id="usr-username" value="${escapeHtml(editing.username)}"></div><div><label>${editing.id_usuario ? 'Nueva contraseña (opcional)' : 'Contraseña inicial'}</label><input id="usr-password" type="password" value=""></div><div><label>Nombre</label><input id="usr-nombre" value="${escapeHtml(editing.nombre)}"></div><div><label>Apellido paterno</label><input id="usr-apellido_paterno" value="${escapeHtml(editing.apellido_paterno)}"></div><div><label>Apellido materno</label><input id="usr-apellido_materno" value="${escapeHtml(editing.apellido_materno)}"></div><div><label>Email</label><input id="usr-email" value="${escapeHtml(editing.email)}"></div><div><label>Teléfono</label><input id="usr-telefono_movil" value="${escapeHtml(editing.telefono_movil)}"></div><div><label>Número empleado</label><input id="usr-numero_empleado" value="${escapeHtml(editing.numero_empleado)}"></div><div><label>Perfil</label><select id="usr-id_rol">${roleOptions}</select></div><div><label>Sede principal</label><select id="usr-id_sede">${siteOptions}</select></div><div><label>Almacén principal</label><select id="usr-id_almacen_principal"><option value="">Sin asignar</option>${whOptions}</select></div><div><label>Turno</label><select id="usr-turno"><option value="matutino" ${editing.turno==='matutino'?'selected':''}>Matutino</option><option value="vespertino" ${editing.turno==='vespertino'?'selected':''}>Vespertino</option><option value="nocturno" ${editing.turno==='nocturno'?'selected':''}>Nocturno</option><option value="mixto" ${editing.turno==='mixto'?'selected':''}>Mixto</option><option value="rotativo" ${editing.turno==='rotativo'?'selected':''}>Rotativo</option></select></div><div><label>Cédula profesional</label><input id="usr-cedula_profesional" value="${escapeHtml(editing.cedula_profesional)}"></div><div><label>Fecha ingreso</label><input id="usr-fecha_ingreso" type="date" value="${escapeHtml((editing.fecha_ingreso||'').slice(0,10))}"></div></div><div class="switch-row"><label><input id="usr-activo" type="checkbox" ${editing.es_activo ? 'checked' : ''}> Activo</label><label><input id="usr-force" type="checkbox" ${editing.requiere_cambio_password ? 'checked' : ''}> Forzar cambio de contraseña</label><label><input id="usr-admin-sede" type="checkbox" ${editing.puede_admin_sede ? 'checked' : ''}> Admin de sede</label></div><div class="card" style="padding:14px 16px;box-shadow:none;background:#F8FAFC"><strong>Sedes autorizadas</strong><div class="inline-checks" style="margin-top:10px">${(lookups.sites||[]).map((site)=> `<label><input type="checkbox" data-user-site value="${site.id_sede}" ${(editing.site_ids||[]).includes(Number(site.id_sede))?'checked':''}> ${escapeHtml(site.nombre)}</label>`).join('')}</div></div><div class="toolbar"><button class="btn" id="saveUser">Guardar usuario</button></div></aside>`; }
function render(){ if(!ctx.permissions.can_manage_users){ app.innerHTML='<div class="card"><strong>Acceso restringido.</strong><p class="muted">Tu perfil no tiene habilitado el gestor de usuarios.</p></div>'; notifyParentHeight(); return; } const active=users.filter(u=>u.es_activo).length; app.innerHTML = html`
  <div class="grid four"><div class="stat-card"><small>Usuarios activos</small><strong>${number(active)}</strong><div class="meta">Acceso habilitado</div></div><div class="stat-card"><small>Usuarios inactivos</small><strong>${number(users.length-active)}</strong><div class="meta">Sesiones revocadas</div></div><div class="stat-card"><small>Perfiles usados</small><strong>${number(new Set(users.map(u=>u.id_rol)).size)}</strong><div class="meta">Roles asignados</div></div><div class="stat-card"><small>Sedes cubiertas</small><strong>${number(new Set(users.flatMap(u=>(u.access||[]).map(a=>a.id_sede))).size)}</strong><div class="meta">Autorizaciones multisede</div></div></div>
  <div class="card filter-bar"><div class="filter-grid"><div><label>Búsqueda</label><input id="flt-search" value="${escapeHtml(filters.search)}" placeholder="usuario, email, nombre..."></div><div><label>Sede</label><select id="flt-site"><option value="">Todas</option>${(lookups.sites||[]).map((s)=> `<option value="${s.id_sede}" ${String(filters.id_sede)===String(s.id_sede)?'selected':''}>${escapeHtml(s.nombre)}</option>`).join('')}</select></div><div><label>Perfil</label><select id="flt-role"><option value="">Todos</option>${(lookups.roles||[]).map((r)=> `<option value="${r.id_rol}" ${String(filters.id_rol)===String(r.id_rol)?'selected':''}>${escapeHtml(r.nombre)}</option>`).join('')}</select></div><div><label>Estado</label><select id="flt-active"><option value="">Todos</option><option value="true" ${filters.active==='true'?'selected':''}>Activos</option><option value="false" ${filters.active==='false'?'selected':''}>Inactivos</option></select></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" id="applyFilters">Aplicar filtros</button><button class="btn secondary" id="newUser">Crear usuario</button></div></div>
  <div class="card"><h2 class="section-title">Tabla de usuarios</h2><div class="table-wrap"><table class="table"><thead><tr><th>Usuario</th><th>Rol</th><th>Sede</th><th>Autorizaciones</th><th>Último acceso</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${users.map((user)=> `<tr><td><div class="row-user"><span class="avatar">${escapeHtml((user.nombre_completo||user.username||'U').trim().charAt(0).toUpperCase())}</span><div><strong>${escapeHtml(user.nombre_completo || user.username)}</strong><div class="muted">${escapeHtml(user.username)} · ${escapeHtml(user.email)}</div></div></div></td><td><span class="chip ${badgeForRole(user.perfil)}">${escapeHtml(user.perfil || '—')}</span></td><td>${escapeHtml(user.sede || '—')}</td><td>${(user.access||[]).map((a)=> `<span class="chip info" style="margin:0 6px 6px 0">${escapeHtml(a.nombre)}</span>`).join('') || '<span class="muted">Sin sedes</span>'}</td><td>${escapeHtml(formatDate(user.ultimo_acceso))}</td><td>${user.es_activo ? '<span class="chip success">Activo</span>' : '<span class="chip danger">Inactivo</span>'}</td><td><div class="table-actions"><button class="btn secondary small" data-edit-user="${user.id_usuario}">Editar</button><button class="btn secondary small" data-audit-user="${user.id_usuario}">Ver accesos</button><button class="btn ${user.es_activo ? 'danger' : 'success'} small" data-state-user="${user.id_usuario}" data-next-state="${!user.es_activo}">${user.es_activo ? 'Desactivar' : 'Activar'}</button></div></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No hay usuarios para el filtro actual.</td></tr>'}</tbody></table></div></div>${slideForm()}`;
  bindFilters(); bindTable(); if(editing){ document.getElementById('slideBackdrop').onclick=closeForm; bindSlide(); } }
load().catch((error)=>{ app.innerHTML = `<div class="card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
