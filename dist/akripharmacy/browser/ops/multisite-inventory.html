<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario local y general</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip info">Inventario</span><h1>Inventario local y consolidado multisede</h1><p>Pestañas grandes para inventario local vs consolidado, con detalle expandible por producto y distribución exacta por sede.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=inventory&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:inventory">Dashboard</a></div></div><div id="app"></div></div><script>
window.akriOps.requireSession();
const { api, html, escapeHtml, formatNumber, formatCurrency, formatShortDate, debounce, notifyParentHeight } = window.akriOps;
const app = document.getElementById('app');
let ctx = null; let general = []; let bySite = []; let local = []; let tab = 'local'; let search = ''; let expanded = new Set();
async function load(){ ctx = await api('/api/multisite/context'); await refresh(); }
async function refresh(){ [local, general, bySite] = await Promise.all([ api(`/api/inventory/summary?scope=local&id_sede=${ctx.current_site.id_sede}&search=${encodeURIComponent(search)}`), api(`/api/inventory/summary?scope=general&search=${encodeURIComponent(search)}`), api(`/api/inventory/summary/by-site?search=${encodeURIComponent(search)}`) ]); render(); }
function detailRows(productId){ return bySite.filter((row)=>Number(row.id_producto)===Number(productId)); }
function toggleExpand(productId){ if (expanded.has(productId)) expanded.delete(productId); else expanded.add(productId); render(); }
function pillForStock(row){ const value = Number(row.stock_disponible_total ?? row.stock_disponible ?? 0); const min = Number(row.stock_minimo ?? 0); if (value <= 0) return '<span class="stock-pill out">Agotado</span>'; if (min && value <= min) return '<span class="stock-pill low">Crítico</span>'; return '<span class="stock-pill good">Óptimo</span>'; }
function renderTable(rows, mode){ return `<div class="table-wrap"><table class="table"><thead><tr><th>Producto</th><th>Stock</th><th>Sedes</th><th>Lotes</th><th>Semáforo</th><th>Vencimiento</th></tr></thead><tbody>${rows.map((row)=>{ const productId = row.id_producto; const open = expanded.has(productId); const detail = detailRows(productId); const stock = mode === 'general' ? row.stock_disponible_total : row.stock_disponible; const sedes = mode === 'general' ? row.sedes_con_stock : 1; const lots = mode === 'general' ? row.lotes_activos : row.lotes; return `<tr class="expandable-row" data-expand="${productId}"><td><strong>${escapeHtml(row.nombre_comercial)}</strong><div class="muted">${escapeHtml(row.sku || '')} · ${escapeHtml(row.codigo_barras || '')}</div></td><td>${formatNumber(stock,3)}</td><td>${formatNumber(sedes || 0)}</td><td>${formatNumber(lots || 0)}</td><td>${pillForStock(row)}</td><td>${escapeHtml(formatShortDate(row.vencimiento_mas_proximo || row.fecha_vencimiento_minima))}</td></tr>${open ? `<tr class="expandable-detail"><td colspan="6"><div class="table-wrap"><table class="table"><thead><tr><th>Sede</th><th>Almacén</th><th>Stock disp.</th><th>Reservado</th><th>Cuarentena</th></tr></thead><tbody>${detail.map((item)=>`<tr><td>${escapeHtml(item.sede_nombre || '')}</td><td>${escapeHtml(item.almacen_nombre || '')}</td><td>${formatNumber(item.stock_disponible,3)}</td><td>${formatNumber(item.stock_reservado,3)}</td><td>${formatNumber(item.stock_cuarentena,3)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Sin distribución detallada.</td></tr>'}</tbody></table></div></td></tr>` : ''}`; }).join('') || '<tr><td colspan="6" class="muted">No hay productos para los filtros actuales.</td></tr>'}</tbody></table></div>`; }
function bind(){ document.querySelectorAll('[data-tab]').forEach((btn)=>btn.addEventListener('click',()=>{ tab=btn.dataset.tab; render(); })); document.getElementById('inventory-search')?.addEventListener('input',debounce((ev)=>{ search = ev.target.value; refresh(); },220)); document.querySelectorAll('[data-expand]').forEach((row)=>row.addEventListener('click',()=>toggleExpand(Number(row.dataset.expand)))); notifyParentHeight(); }
function render(){ const currentRows = tab === 'local' ? local : general; const totalLocal = local.reduce((acc,row)=>acc + Number(row.stock_disponible || 0),0); const totalGeneral = general.reduce((acc,row)=>acc + Number(row.stock_disponible_total || 0),0); const totalValue = general.reduce((acc,row)=>acc + Number(row.valor_venta_total || 0),0); app.innerHTML = html`
  <div class="grid three">
    <div class="card kpi"><div><small>Inventario local</small><strong>${formatNumber(totalLocal,3)}</strong><div class="helper">Sede activa: ${escapeHtml(ctx.current_site.nombre)}</div></div><span class="chip success">📍 Local</span></div>
    <div class="card kpi"><div><small>Inventario general</small><strong>${formatNumber(totalGeneral,3)}</strong><div class="helper">Todas las sedes consolidadas</div></div><span class="chip info">🌐 Global</span></div>
    <div class="card kpi"><div><small>Valor consolidado</small><strong>${escapeHtml(formatCurrency(totalValue))}</strong><div class="helper">Base comercial multisede</div></div><span class="chip primary">Valuación</span></div>
  </div>
  <div class="card"><div class="banner-row"><div><h2 class="section-title">Inventario por vista</h2><div class="subtitle">Al abrir una fila se despliega la subtabla con la distribución exacta por sede.</div></div><div class="toolbar"><div class="tabs"><button class="tab-btn ${tab==='local'?'active':''}" data-tab="local">📍 Inventario local</button><button class="tab-btn ${tab==='general'?'active':''}" data-tab="general">🌐 Consolidado multisede</button></div><div style="min-width:280px"><input id="inventory-search" value="${escapeHtml(search)}" placeholder="Buscar producto, SKU o código"></div></div></div>${renderTable(currentRows, tab==='general' ? 'general' : 'local')}</div>`; bind(); }
load().catch((error)=>{ app.innerHTML = `<div class="card empty-state"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
