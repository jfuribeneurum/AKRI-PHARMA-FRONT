<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes de dispensación</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip success">Dispensación</span><h1>Manual, HCE y fórmula escaneada</h1><p>Interfaz tipo POS, botones grandes de origen y panel de checkout con paciente, ítems y validación visual del inventario local.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=dispensing&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:dispensing">Dashboard</a></div></div><div id="app"></div><script>
requireSession();
const { api, html, escapeHtml, notifyParentHeight, toast } = window.akriOps;
const app = document.getElementById('app');
let lookups=null, catalog=[], requests=[]; let mode='manual';
const patient = { nombre:'', documento:'', direccion:'', telefono:'' }; let notes=''; let siteId=''; let warehouseId=''; let manualItems=[blankItem()];
function blankItem(){ return { descripcion_libre:'', cantidad_solicitada:'', dosis:'', frecuencia:'', via_administracion:'', duracion:'', observaciones:'' }; }
async function load(){ [lookups, requests] = await Promise.all([ api('/api/dispensing/lookups'), api('/api/dispensing/requests').catch(()=>[]) ]); siteId = siteId || String(lookups.sites?.[0]?.id_sede || ''); warehouseId = warehouseId || String((lookups.warehouses || []).find((w)=>String(w.id_sede)===String(siteId))?.id_almacen || ''); render(); }
function warehouses(){ return (lookups?.warehouses || []).filter((w)=>String(w.id_sede)===String(siteId)); }
async function loadCatalog(term=''){ catalog = await api(`/api/dispensing/catalog?search=${encodeURIComponent(term)}&id_sede=${encodeURIComponent(siteId)}`).catch(()=>[]); renderCheckout(); }
function renderCheckout(){ const checkout = document.getElementById('checkoutPanel'); if(!checkout) return; const items = mode==='manual' ? manualItems : []; checkout.innerHTML = `<h3 style="margin-top:0">Panel de checkout</h3><p class="helper">Resumen del paciente y de la solicitud preparada.</p><div class="notice info"><strong>Paciente</strong><div>${escapeHtml(patient.nombre || '—')}</div><div class="muted">${escapeHtml(patient.documento || 'Sin documento')} · ${escapeHtml(patient.telefono || 'Sin teléfono')}</div></div><div style="margin-top:12px">${items.length ? items.map((item)=>`<div class="catalog-item"><div><strong>${escapeHtml(item.descripcion_libre || 'Ítem pendiente')}</strong><div class="muted">Cantidad ${escapeHtml(item.cantidad_solicitada || '0')}</div></div><div>${Number(item.cantidad_solicitada || 0) > 0 ? '<span class="chip success">OK</span>' : '<span class="chip danger">Falta</span>'}</div></div>`).join('') : '<div class="notice">Usa uno de los orígenes para poblar el ticket.</div>'}<div class="toolbar" style="margin-top:12px"><button class="btn success" id="confirmRequest">Confirmar solicitud de dispensación</button></div>`; document.getElementById('confirmRequest')?.addEventListener('click', submitCurrent); notifyParentHeight(); }
function itemRow(index,item={}){ return `<div class="catalog-item" data-manual-row="${index}"><div class="form-grid"><div><label>Medicamento</label><input data-k="descripcion_libre" value="${escapeHtml(item.descripcion_libre || '')}" placeholder="Medicamento"></div><div><label>Cantidad</label><input data-k="cantidad_solicitada" type="number" step="0.001" value="${escapeHtml(item.cantidad_solicitada || '')}"></div><div><label>Dosis</label><input data-k="dosis" value="${escapeHtml(item.dosis || '')}"></div><div><label>Frecuencia</label><input data-k="frecuencia" value="${escapeHtml(item.frecuencia || '')}"></div><div><label>Vía</label><input data-k="via_administracion" value="${escapeHtml(item.via_administracion || '')}"></div><div><label>Duración</label><input data-k="duracion" value="${escapeHtml(item.duracion || '')}"></div><div class="full"><label>Observaciones</label><input data-k="observaciones" value="${escapeHtml(item.observaciones || '')}"></div></div><div><button class="btn secondary small" data-remove-manual="${index}">Quitar</button></div></div>`; }
function collectManual(){ manualItems = [...document.querySelectorAll('[data-manual-row]')].map((row)=>({ descripcion_libre:row.querySelector('[data-k="descripcion_libre"]').value, cantidad_solicitada:Number(row.querySelector('[data-k="cantidad_solicitada"]').value || 0), dosis:row.querySelector('[data-k="dosis"]').value || null, frecuencia:row.querySelector('[data-k="frecuencia"]').value || null, via_administracion:row.querySelector('[data-k="via_administracion"]').value || null, duracion:row.querySelector('[data-k="duracion"]').value || null, observaciones:row.querySelector('[data-k="observaciones"]').value || null })).filter((item)=>item.descripcion_libre && item.cantidad_solicitada>0); }
async function submitCurrent(){ try { const base = { id_sede:Number(siteId), id_almacen_sugerido: warehouseId ? Number(warehouseId) : null, observaciones: notes || null, paciente:{ nombre:patient.nombre, documento:patient.documento, direccion:patient.direccion, telefono:patient.telefono } }; if(!patient.nombre || !patient.documento) throw new Error('Debes completar al menos nombre y documento del paciente.'); if(mode==='manual'){ collectManual(); if(!manualItems.length) throw new Error('Agrega al menos un medicamento.'); await api('/api/dispensing/requests', { method:'POST', body:{ ...base, items:manualItems } }); } else if(mode==='ehr'){ const payload = JSON.parse(document.getElementById('ehrJson').value || '{}'); await api('/api/dispensing/requests/import/ehr', { method:'POST', body:{ ...base, items: payload.items || [], payload_origen: payload } }); } else { const file = document.getElementById('scanFile').files[0]; if(!file) throw new Error('Adjunta la fórmula médica escaneada.'); const dataUrl = await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>reject(new Error('No fue posible leer el archivo')); r.readAsDataURL(file); }); const items = JSON.parse(document.getElementById('scanItems').value || '[]'); await api('/api/dispensing/requests/import/prescription-scan', { method:'POST', body:{ ...base, archivo_nombre:file.name, archivo_data_url:dataUrl, items, payload_origen:{ source:'scan' } } }); }
      toast('Solicitud de dispensación creada.', 'success'); await load(); } catch(error){ toast(error.message, 'error'); } }
function bind(){ ['patientNombre','patientDocumento','patientDireccion','patientTelefono'].forEach((id)=>document.getElementById(id)?.addEventListener('input',(e)=>{ const map={patientNombre:'nombre',patientDocumento:'documento',patientDireccion:'direccion',patientTelefono:'telefono'}; patient[map[id]]=e.target.value; renderCheckout(); })); document.getElementById('siteSelect')?.addEventListener('change',(e)=>{ siteId=e.target.value; warehouseId=String(warehouses()[0]?.id_almacen || ''); render(); }); document.getElementById('warehouseSelect')?.addEventListener('change',(e)=>{ warehouseId=e.target.value; }); document.getElementById('notes')?.addEventListener('input',(e)=>notes=e.target.value); document.querySelectorAll('[data-mode]').forEach((b)=>b.addEventListener('click',()=>{ mode=b.dataset.mode; render(); })); document.getElementById('addManualItem')?.addEventListener('click',()=>{ const host=document.getElementById('manualItems'); host.insertAdjacentHTML('beforeend', itemRow(host.children.length+1)); bindManualRows(); notifyParentHeight(); }); bindManualRows(); renderCheckout(); notifyParentHeight(); }
function bindManualRows(){ document.querySelectorAll('[data-remove-manual]').forEach((b)=>b.addEventListener('click',()=>{ b.closest('[data-manual-row]').remove(); collectManual(); renderCheckout(); })); document.querySelectorAll('[data-manual-row] input').forEach((el)=>el.addEventListener('input',()=>{ collectManual(); renderCheckout(); })); }
function render(){ app.innerHTML = html`<div class="pos-shell"><section class="card"><div class="form-grid"><div><label>Sede</label><select id="siteSelect">${(lookups?.sites || []).map((site)=>`<option value="${site.id_sede}" ${String(siteId)===String(site.id_sede)?'selected':''}>${escapeHtml(site.nombre)}</option>`).join('')}</select></div><div><label>Almacén</label><select id="warehouseSelect">${warehouses().map((w)=>`<option value="${w.id_almacen}" ${String(warehouseId)===String(w.id_almacen)?'selected':''}>${escapeHtml(w.nombre)}</option>`).join('')}</select></div></div><div class="pos-actions"><button class="pos-action ${mode==='manual'?'active':''}" data-mode="manual">⌨️ Carga manual</button><button class="pos-action ${mode==='ehr'?'active':''}" data-mode="ehr">⚕️ Importar HCE</button><button class="pos-action ${mode==='scan'?'active':''}" data-mode="scan">📠 Escanear fórmula</button></div><div class="form-grid"><div><label>Paciente</label><input id="patientNombre" value="${escapeHtml(patient.nombre)}"></div><div><label>Documento</label><input id="patientDocumento" value="${escapeHtml(patient.documento)}"></div><div><label>Dirección</label><input id="patientDireccion" value="${escapeHtml(patient.direccion)}"></div><div><label>Teléfono</label><input id="patientTelefono" value="${escapeHtml(patient.telefono)}"></div><div class="full"><label>Observaciones</label><textarea id="notes">${escapeHtml(notes)}</textarea></div></div>${mode==='manual' ? `<div id="manualItems" class="catalog-list" style="margin-top:14px">${manualItems.map((item,index)=>itemRow(index+1,item)).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn secondary" id="addManualItem">Agregar medicamento</button></div>` : ''}${mode==='ehr' ? `<div class="card tight" style="margin-top:14px"><label>Payload HCE (JSON)</label><textarea id="ehrJson" placeholder='{"items":[{"descripcion_libre":"Amoxicilina 500 mg","cantidad_solicitada":14}]}'></textarea></div>` : ''}${mode==='scan' ? `<div class="card tight" style="margin-top:14px"><div class="form-grid"><div><label>Archivo fórmula</label><input id="scanFile" type="file" accept="image/*,.pdf"></div><div><label>Ítems interpretados (JSON)</label><textarea id="scanItems" placeholder='[{"descripcion_libre":"Insulina glargina","cantidad_solicitada":1}]'></textarea></div></div></div>` : ''}<div class="card tight" style="margin-top:14px"><h3 style="margin-top:0">Cola de solicitudes</h3><div class="table-wrap"><table class="table compact"><thead><tr><th>Consecutivo</th><th>Paciente</th><th>Estado</th><th>Origen</th></tr></thead><tbody>${requests.map((row)=>`<tr><td>${escapeHtml(row.consecutivo || '—')}</td><td>${escapeHtml(row.paciente_nombre || row.nombre || '—')}</td><td><span class="chip ${row.estado==='atendida'?'success':'info'}">${escapeHtml(row.estado || 'pendiente')}</span></td><td>${escapeHtml(row.origen || row.referencia_externa || '—')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin solicitudes.</td></tr>'}</tbody></table></div></div></section><aside class="checkout-panel" id="checkoutPanel"></aside></div>`; bind(); }
load().catch((error)=>{ app.innerHTML = `<div class="card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
