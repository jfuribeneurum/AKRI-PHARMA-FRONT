<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de sedes</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip primary">Multisede</span><h1>Gestor de sedes</h1><p>Creación, edición, desactivación con validaciones y auditoría cronológica por sede. Cada nueva sede se provisiona con almacén general, cadena de frío, controlados y queda incluida en el inventario general.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=sites&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:sites">Dashboard</a></div></div><div id="app"></div><script>
requireSession();
const { api, html, escapeHtml, formatDate, number, notifyParentHeight, drawerShell, toast } = window.akriOps;
const app = document.getElementById('app');
let ctx = null, sites = [], form = blank();
function blank(){ return { id_sede:null, codigo:'', nombre:'', ciudad:'', direccion:'', telefono:'', email:'', responsable:'', es_principal:false, activo:true }; }
async function load(){ [ctx, sites] = await Promise.all([api('/api/multisite/context'), api('/api/admin/sites')]); render(); }
function activeCount(){ return sites.filter(s=>s.activo).length; }
function inactiveCount(){ return sites.filter(s=>!s.activo).length; }
function fill(site){ form = { id_sede:Number(site.id_sede), codigo:site.codigo||'', nombre:site.nombre||'', ciudad:site.ciudad||'', direccion:site.direccion||'', telefono:site.telefono||'', email:site.email||'', responsable:site.responsable||'', es_principal:Boolean(site.es_principal), activo:Boolean(site.activo) }; render(); }
function reset(){ form = blank(); render(); }
async function save(){
  const payload = { codigo:form.codigo, nombre:form.nombre, ciudad:form.ciudad||null, direccion:form.direccion||null, telefono:form.telefono||null, email:form.email||null, responsable:form.responsable||null, es_principal:Boolean(form.es_principal), activo:Boolean(form.activo) };
  try{
    if(!payload.codigo || !payload.nombre) throw new Error('Código y nombre son obligatorios');
    if(form.id_sede){ await api(`/api/admin/sites/${form.id_sede}`, { method:'PUT', body: JSON.stringify(payload) }); toast('Sede actualizada', 'success'); }
    else { await api('/api/admin/sites', { method:'POST', body: JSON.stringify(payload) }); toast('Sede creada y provisionada', 'success'); }
    form = blank();
    await load();
  }catch(error){ toast(error.message,'error',4600); }
}
async function toggle(site){
  try{
    if(site.activo) await api(`/api/admin/sites/${site.id_sede}`, { method:'DELETE' });
    else await api(`/api/admin/sites/${site.id_sede}`, { method:'PUT', body: JSON.stringify({ activo:true }) });
    toast(site.activo ? 'Sede desactivada' : 'Sede reactivada', 'success');
    await load();
  }catch(error){ toast(error.message,'error',5200); }
}
async function audit(site){
  try{
    const rows = await api(`/api/admin/sites/${site.id_sede}/audit?limit=80`);
    const drawer = drawerShell(`
      <div class="drawer-head"><div><span class="chip info">Auditoría</span><h2 style="margin:.35rem 0 0">${escapeHtml(site.nombre)}</h2><div class="muted">Línea de tiempo administrativa y logística</div></div><button class="btn secondary" id="closeDrawer">Cerrar</button></div>
      <div class="timeline">${rows.length ? rows.map((row)=>`<div class="timeline-item"><div class="dot"></div><div class="content"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>${escapeHtml(row.descripcion || row.submodulo || row.accion || 'Evento')}</strong><span class="chip primary">${escapeHtml(formatDate(row.fecha_hora))}</span></div><div class="muted" style="margin-top:6px">Usuario: ${escapeHtml(row.usuario || 'Sistema')} · Perfil: ${escapeHtml(row.perfil_nombre || '—')}</div><div class="muted">Acción: ${escapeHtml(row.accion || '—')} · Tabla: ${escapeHtml(row.tabla_afectada || '—')}</div></div></div>`).join('') : '<div class="notice">Sin eventos auditables para esta sede.</div>'}</div>`);
    drawer.querySelector('#closeDrawer').onclick = ()=> drawer.remove();
  }catch(error){ toast(error.message,'error'); }
}
function bind(){
  ['codigo','nombre','ciudad','direccion','telefono','email','responsable'].forEach((key)=>{ const el=document.getElementById(`site-${key}`); if(el) el.oninput=(e)=> form[key]=e.target.value; });
  document.getElementById('site-principal').onchange=(e)=> form.es_principal=e.target.checked;
  document.getElementById('site-activo').onchange=(e)=> form.activo=e.target.checked;
  document.getElementById('saveSite').onclick=save;
  document.getElementById('resetSite').onclick=reset;
  document.querySelectorAll('[data-edit]').forEach((btn)=> btn.onclick=()=> fill(sites.find(s=>Number(s.id_sede)===Number(btn.dataset.edit))));
  document.querySelectorAll('[data-toggle]').forEach((btn)=> btn.onclick=()=> toggle(sites.find(s=>Number(s.id_sede)===Number(btn.dataset.toggle))));
  document.querySelectorAll('[data-audit]').forEach((btn)=> btn.onclick=()=> audit(sites.find(s=>Number(s.id_sede)===Number(btn.dataset.audit))));
  notifyParentHeight();
}
function render(){
  if(!ctx.permissions.can_manage_sites){ app.innerHTML = '<div class="card"><strong>Acceso restringido.</strong><p class="muted">Tu perfil no tiene habilitado el gestor de sedes.</p></div>'; notifyParentHeight(); return; }
  const totalStock = sites.reduce((acc,row)=> acc + Number(row.stock_local || 0), 0);
  app.innerHTML = html`
    <div class="top-context"><div><h2 style="margin:0 0 6px">Panel de sedes</h2><div class="muted">Actúa desde dashboard y banner superior. Las desactivaciones validan stock, usuarios y solicitudes pendientes.</div></div><div class="meta"><span class="chip primary">Central: ${escapeHtml(sites.find(s=>s.es_principal)?.nombre || '—')}</span><span class="chip info">Activas ${activeCount()}</span><span class="chip danger">Inactivas ${inactiveCount()}</span></div></div>
    <div class="grid four">
      <div class="stat-card"><small>Sedes activas</small><strong>${number(activeCount())}</strong><div class="meta">Operando con inventario local</div></div>
      <div class="stat-card"><small>Sedes inactivas</small><strong>${number(inactiveCount())}</strong><div class="meta">Soft-delete con trazabilidad</div></div>
      <div class="stat-card"><small>Stock consolidado</small><strong>${number(totalStock,3)}</strong><div class="meta">Suma de inventarios locales</div></div>
      <div class="stat-card"><small>Solicitudes a central</small><strong>${number(sites.reduce((a,b)=> a + Number(b.pendientes_compra || 0),0))}</strong><div class="meta">Pendientes asociadas a sedes</div></div>
    </div>
    <div class="grid two">
      <div class="card">
        <h2 class="section-title">${form.id_sede ? 'Editar sede' : 'Crear sede'}</h2>
        <div class="helper">Formulario rápido con los datos mínimos de la sucursal: nombre, ubicación, tipo operativo y estado.</div>
        <div class="form-grid" style="margin-top:14px">
          <div><label>Código</label><input id="site-codigo" value="${escapeHtml(form.codigo)}" placeholder="NOR-01"></div>
          <div><label>Nombre</label><input id="site-nombre" value="${escapeHtml(form.nombre)}" placeholder="Sede Norte"></div>
          <div><label>Ciudad</label><input id="site-ciudad" value="${escapeHtml(form.ciudad)}" placeholder="Medellín"></div>
          <div><label>Teléfono</label><input id="site-telefono" value="${escapeHtml(form.telefono)}"></div>
          <div class="full"><label>Dirección</label><input id="site-direccion" value="${escapeHtml(form.direccion)}"></div>
          <div><label>Email</label><input id="site-email" value="${escapeHtml(form.email)}"></div>
          <div><label>Responsable</label><input id="site-responsable" value="${escapeHtml(form.responsable)}"></div>
        </div>
        <div class="switch-row"><label><input id="site-principal" type="checkbox" ${form.es_principal ? 'checked' : ''}> Sede central</label><label><input id="site-activo" type="checkbox" ${form.activo ? 'checked' : ''}> Sede activa</label></div>
        <div class="toolbar" style="margin-top:14px"><button class="btn" id="saveSite">${form.id_sede ? 'Guardar cambios' : 'Crear sede y estructura'}</button><button class="btn secondary" id="resetSite">Limpiar</button></div>
      </div>
      <div class="card">
        <h2 class="section-title">Resumen de operación</h2>
        <div class="helper">El banner superior puede cambiar la sede activa y abrir “⚙️ Administrar sedes”.</div>
        <div class="cards-grid" style="margin-top:14px">
          <div class="site-card"><strong>Inventario local</strong><div class="muted">Cada sede conserva su inventario operativo y sus movimientos de ingreso/dispensación.</div></div>
          <div class="site-card"><strong>Inventario general</strong><div class="muted">El consolidado suma todas las sedes y permite drill-down por producto.</div></div>
          <div class="site-card"><strong>Auditoría</strong><div class="muted">Usa el panel lateral para revisar la línea de tiempo de cada sede.</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">DataGrid de sedes</h2>
      <div class="table-wrap"><table class="table"><thead><tr><th>Sede</th><th>Tipo</th><th>Estado</th><th>Stock</th><th>Usuarios</th><th>Solicitudes</th><th>Acciones</th></tr></thead><tbody>
      ${sites.map((site)=> `<tr>
        <td><strong>${escapeHtml(site.nombre)}</strong><div class="muted">${escapeHtml(site.codigo)} · ${escapeHtml(site.ciudad || 'Sin ciudad')}</div></td>
        <td>${site.es_principal ? '<span class="chip primary">Central</span>' : '<span class="chip info">Periférica</span>'}</td>
        <td>${site.activo ? '<span class="chip success">Activa</span>' : '<span class="chip danger">Inactiva</span>'}</td>
        <td>${number(site.stock_local || 0,3)}</td>
        <td>${number(site.usuarios || 0)}</td>
        <td>${number(site.pendientes_compra || 0)}</td>
        <td><div class="table-actions"><button class="btn secondary small" data-edit="${site.id_sede}">Editar</button><button class="btn secondary small" data-audit="${site.id_sede}">Auditar</button>${site.es_principal ? '<span class="chip primary">Protegida</span>' : `<button class="btn ${site.activo ? 'danger' : 'success'} small" data-toggle="${site.id_sede}" ${site.activo && !ctx.permissions.can_delete_sites ? 'disabled' : ''}>${site.activo ? 'Desactivar' : 'Reactivar'}</button>`}</div></td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">No hay sedes registradas.</td></tr>'}
      </tbody></table></div>
    </div>`;
  bind();
}
load().catch((error)=>{ app.innerHTML = `<div class="card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
