<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz de permisos</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip primary">Matriz de permisos</span><h1>Funciones asignables por administrador principal</h1><p>Matrix DataGrid con filas por micro-función, columnas por perfil, headers pegajosos y pie flotante para guardar cambios solo cuando existan modificaciones.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=permissions&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:permissions">Dashboard</a></div></div><div id="app"></div><script>
requireSession();
const { api, html, escapeHtml, toast, notifyParentHeight } = window.akriOps;
const app = document.getElementById('app');
let profiles=[], lookups=null, roleUsabilities=new Map(), dirty=false;
async function load(){ [profiles, lookups] = await Promise.all([ api('/api/admin/profiles'), api('/api/admin/lookups') ]); const results = await Promise.all(profiles.map((profile)=>api(`/api/admin/profiles/${profile.id_rol}/usabilities`).catch(()=>[]))); roleUsabilities = new Map(profiles.map((profile,idx)=>[profile.id_rol, new Set((results[idx] || []).filter((item)=>item.habilitado!==false).map((item)=>item.clave))])); dirty=false; render(); }
function toggle(roleId, key, checked){ const set = roleUsabilities.get(roleId) || new Set(); if(checked) set.add(key); else set.delete(key); roleUsabilities.set(roleId, set); dirty=true; renderFooter(); }
function renderFooter(){ const footer = document.getElementById('matrixFooter'); if(!footer) return; footer.innerHTML = dirty ? `<span class="chip accent">Hay cambios sin guardar</span><button class="btn" id="saveMatrix">Guardar matriz de permisos</button>` : `<span class="chip success">Sin cambios pendientes</span><button class="btn secondary" disabled>Guardar matriz de permisos</button>`; document.getElementById('saveMatrix')?.addEventListener('click', saveAll); }
async function saveAll(){ try { const catalogMap = new Map((lookups.usability_catalog || []).map((item)=>[item.clave,item])); for(const profile of profiles){ const set = roleUsabilities.get(profile.id_rol) || new Set(); const items = [...set].map((key)=>({ clave:key, nombre:catalogMap.get(key)?.nombre || key, descripcion:catalogMap.get(key)?.descripcion || null, categoria:catalogMap.get(key)?.categoria || 'general', habilitado:true, metadata:{ source:'matrix-v23' } })); await api(`/api/admin/profiles/${profile.id_rol}/usabilities`, { method:'PUT', body:{ items } }); } dirty=false; toast('Matriz de permisos guardada.', 'success'); renderFooter(); } catch(error){ toast(error.message, 'error'); } }
function render(){ const catalog = lookups?.usability_catalog || []; app.innerHTML = html`<div class="matrix-shell"><table class="matrix"><thead><tr><th class="sticky-col">Módulo / acción específica</th>${profiles.map((profile)=>`<th><div>${escapeHtml(profile.nombre)}</div><small>${escapeHtml(profile.descripcion || '')}</small></th>`).join('')}</tr></thead><tbody>${catalog.map((item)=>`<tr><td class="sticky-col"><strong>${escapeHtml(item.nombre)}</strong><div class="muted">${escapeHtml(item.categoria)} · ${escapeHtml(item.descripcion || '')}</div></td>${profiles.map((profile)=>`<td style="text-align:center"><input type="checkbox" data-role="${profile.id_rol}" data-key="${escapeHtml(item.clave)}" ${(roleUsabilities.get(profile.id_rol) || new Set()).has(item.clave) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}</tbody></table><div class="sticky-footer" id="matrixFooter"></div></div>`;
  document.querySelectorAll('[data-role][data-key]').forEach((el)=>el.addEventListener('change',()=>toggle(Number(el.dataset.role), el.dataset.key, el.checked))); renderFooter(); notifyParentHeight(); }
load().catch((error)=>{ app.innerHTML = `<div class="card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
