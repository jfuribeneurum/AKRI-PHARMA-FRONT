<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes de dispensación</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip accent">Dispensación</span><h1>Solicitudes manuales, HCE y fórmula escaneada</h1><p>Interfaz POS de alto contraste, tres orígenes de carga y panel de checkout con resumen del paciente, medicamentos y alertas de stock.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=dispensing&v=26">Centro de control</a></div></div><div id="app"></div><script>
requireSession();
const { api, html, escapeHtml, debounce, toast, notifyParentHeight } = window.akriOps;
const app = document.getElementById('app');
let ctx = null; let lookups = null; let requests = []; let mode = 'manual'; let catalog = []; let suggestions = []; let cart = []; let fileDataUrl = '';
const patient = { nombre:'', documento:'', telefono:'', direccion:'' };
async function load(){ [ctx, lookups, requests] = await Promise.all([ api('/api/multisite/context'), api('/api/dispensing/lookups'), api('/api/dispensing/requests') ]); render(); }
const searchItems = debounce(async (value) => { if (!value || value.length < 2) { suggestions = []; return render(); } catalog = await api(`/api/dispensing/catalog?search=${encodeURIComponent(value)}&id_sede=${ctx.current_site.id_sede}`); suggestions = catalog.slice(0, 8); render(); }, 220);
function addItem(item){ cart.push({ id_producto:item.id_producto || null, descripcion_libre:item.nombre_comercial || item.descripcion_libre, cantidad_solicitada:1, dosis:item.concentracion || '', via_administracion:'', frecuencia:'', duracion:'', stock:item.stock_disponible_total || item.stock_disponible || 0 }); suggestions = []; render(); }
function updateItem(index, key, value){ cart[index][key] = key === 'cantidad_solicitada' ? Number(value || 0) : value; render(); }
async function saveManual(){
  try {
    const payload = { id_sede:Number(ctx.current_site.id_sede), id_almacen_sugerido:Number(lookups.almacenes?.[0]?.id_almacen || 1), observaciones:document.getElementById('manualNotes').value || null, paciente:{ nombre:patient.nombre, documento:patient.documento, telefono:patient.telefono, direccion:patient.direccion }, items:cart.map((item) => ({ id_producto:item.id_producto, descripcion_libre:item.descripcion_libre, dosis:item.dosis || null, via_administracion:item.via_administracion || null, frecuencia:item.frecuencia || null, duracion:item.duracion || null, cantidad_solicitada:Number(item.cantidad_solicitada || 0) })).filter((item) => item.descripcion_libre && item.cantidad_solicitada > 0) };
    await api('/api/dispensing/requests', { method:'POST', body: JSON.stringify(payload) });
    cart = []; toast('Solicitud manual registrada.', 'success'); await load();
  } catch (error) { toast(error.message || 'No fue posible guardar la solicitud.', 'error'); }
}
async function importEhr(){
  try { const payload = JSON.parse(document.getElementById('ehrJson').value || '{}'); await api('/api/dispensing/requests/import/ehr', { method:'POST', body: JSON.stringify(payload) }); toast('Solicitud HCE importada.', 'success'); await load(); } catch (error) { toast(error.message || 'No fue posible importar la HCE.', 'error'); }
}
async function importScan(){
  try {
    const file = document.getElementById('scanFile').files[0];
    if (!file) throw new Error('Selecciona una imagen o PDF de fórmula médica.');
    fileDataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('No fue posible leer el archivo.')); reader.readAsDataURL(file); });
    const payload = { id_sede:Number(ctx.current_site.id_sede), id_almacen_sugerido:Number(lookups.almacenes?.[0]?.id_almacen || 1), archivo_nombre:document.getElementById('scanName').value || file.name, archivo_data_url:fileDataUrl, observaciones:document.getElementById('scanNotes').value || null, paciente:{ nombre:patient.nombre, documento:patient.documento, telefono:patient.telefono, direccion:patient.direccion }, items:JSON.parse(document.getElementById('scanItems').value || '[]') };
    await api('/api/dispensing/requests/import/prescription-scan', { method:'POST', body: JSON.stringify(payload) });
    toast('Solicitud por fórmula escaneada registrada.', 'success'); await load();
  } catch (error) { toast(error.message || 'No fue posible importar la fórmula.', 'error'); }
}
function checkoutPanel(){ const stockProblems = cart.filter((item) => Number(item.stock || 0) < Number(item.cantidad_solicitada || 0)); return `<div class="ticket"><div><div class="kicker" style="color:rgba(255,255,255,.68)">Checkout</div><h3 style="margin:4px 0 8px;font-size:24px">Resumen del paciente</h3><div class="muted" style="color:rgba(255,255,255,.8)">${escapeHtml(patient.nombre || 'Paciente pendiente')} · ${escapeHtml(patient.documento || 'Sin documento')}</div></div><div class="line"><span>Medicamentos cargados</span><strong>${cart.length}</strong></div><div class="line"><span>Items sin stock suficiente</span><strong>${stockProblems.length}</strong></div>${stockProblems.length ? `<div class="alert">Falta stock para ${stockProblems.map((item) => escapeHtml(item.descripcion_libre)).join(', ')}.</div>` : ''}<div><strong>Checklist</strong><ul style="margin:10px 0 0;padding-left:18px">${cart.map((item) => `<li>${escapeHtml(item.descripcion_libre)} · ${Number(item.cantidad_solicitada || 0)}</li>`).join('') || '<li>Sin items</li>'}</ul></div><button class="btn success" id="confirmCheckout" ${mode === 'manual' ? '' : 'style="display:none"'}>Confirmar dispensación / solicitud</button></div>`; }
function manualView(){ return html`<div class="split-screen"><div class="split-panel"><div class="segmented"><button class="${mode==='manual'?'active':''}" data-mode="manual">⌨️ Carga manual</button><button class="${mode==='ehr'?'active':''}" data-mode="ehr">⚕️ Importar HCE</button><button class="${mode==='scan'?'active':''}" data-mode="scan">📠 Escanear fórmula</button></div><div class="surface-card" style="margin-top:16px;background:#F8FAFC;box-shadow:none"><div class="form-grid"><div><label>Paciente</label><input id="patient-name" value="${escapeHtml(patient.nombre)}"></div><div><label>Cédula</label><input id="patient-doc" value="${escapeHtml(patient.documento)}"></div><div><label>Teléfono</label><input id="patient-phone" value="${escapeHtml(patient.telefono)}"></div><div><label>Dirección</label><input id="patient-address" value="${escapeHtml(patient.direccion)}"></div></div></div>${mode==='manual' ? `<div style="margin-top:16px"><label>Buscar medicamento</label><input id="dispSearch" placeholder="Nombre, SKU o código de barras"></div>${suggestions.length ? `<div class="predictive-list" style="margin-top:12px">${suggestions.map((item) => `<button class="predictive-item" data-add-disp="${item.id_producto}"><strong>${escapeHtml(item.nombre_comercial)}</strong><div class="muted">Stock ${Number(item.stock_disponible || item.stock_disponible_total || 0).toFixed(3)} · ${escapeHtml(item.sku || '')}</div></button>`).join('')}</div>` : ''}<div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Medicamento</th><th>Cantidad</th><th>Dosis</th><th>Vía/Frecuencia</th><th></th></tr></thead><tbody>${cart.map((item, index) => `<tr><td><strong>${escapeHtml(item.descripcion_libre)}</strong><div class="muted">Stock ${Number(item.stock || 0).toFixed(3)}</div></td><td><input type="number" min="1" step="1" value="${Number(item.cantidad_solicitada || 0)}" data-item-qty="${index}"></td><td><input value="${escapeHtml(item.dosis || '')}" data-item-dose="${index}"></td><td><input value="${escapeHtml(item.via_administracion || '')}" placeholder="Vía" data-item-via="${index}"><input style="margin-top:8px" value="${escapeHtml(item.frecuencia || '')}" placeholder="Frecuencia" data-item-freq="${index}"></td><td><button class="btn danger small" data-remove-item="${index}">Quitar</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Sin medicamentos cargados.</td></tr>'}</tbody></table></div><label style="margin-top:12px">Observaciones</label><textarea id="manualNotes" placeholder="Observaciones clínicas u operativas"></textarea>` : ''}${mode==='ehr' ? `<div class="surface-card" style="margin-top:16px;background:#F8FAFC;box-shadow:none"><label>Payload JSON desde HCE</label><textarea id="ehrJson" rows="14" placeholder='{"id_sede":1,"paciente":{"nombre":"...","documento":"...","direccion":"...","telefono":"..."},"items":[{"descripcion_libre":"Amoxicilina","cantidad_solicitada":21}]}'></textarea><div class="toolbar" style="margin-top:14px"><button class="btn" id="importEhr">Importar HCE</button></div></div>` : ''}${mode==='scan' ? `<div class="surface-card" style="margin-top:16px;background:#F8FAFC;box-shadow:none"><div class="form-grid"><div><label>Nombre archivo</label><input id="scanName" placeholder="formula.jpg"></div><div><label>Archivo</label><input id="scanFile" type="file" accept="image/*,.pdf"></div><div class="full"><label>Items transcritos (JSON)</label><textarea id="scanItems" rows="8" placeholder='[{"descripcion_libre":"Insulina NPH","cantidad_solicitada":1}]'></textarea></div><div class="full"><label>Observaciones</label><textarea id="scanNotes"></textarea></div></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="importScan">Guardar fórmula escaneada</button></div></div>` : ''}</div><div class="split-panel">${checkoutPanel()}<div class="surface-card" style="margin-top:16px;background:#F8FAFC;box-shadow:none"><h3 style="margin-top:0">Solicitudes registradas</h3><div class="table-wrap"><table class="table"><thead><tr><th>Consecutivo</th><th>Origen</th><th>Estado</th><th>Paciente</th></tr></thead><tbody>${requests.map((row) => `<tr><td>${escapeHtml(row.consecutivo)}</td><td>${escapeHtml(row.tipo_origen)}</td><td><span class="chip ${row.estado === 'dispensada' ? 'success' : 'info'}">${escapeHtml(row.estado)}</span></td><td>${escapeHtml(row.paciente || '—')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin solicitudes previas.</td></tr>'}</tbody></table></div></div></div></div>`; }
function render(){ app.innerHTML = manualView(); document.querySelectorAll('[data-mode]').forEach((button) => button.addEventListener('click', () => { mode = button.dataset.mode; render(); })); document.getElementById('patient-name')?.addEventListener('input', (ev) => { patient.nombre = ev.target.value; render(); }); document.getElementById('patient-doc')?.addEventListener('input', (ev) => { patient.documento = ev.target.value; render(); }); document.getElementById('patient-phone')?.addEventListener('input', (ev) => { patient.telefono = ev.target.value; render(); }); document.getElementById('patient-address')?.addEventListener('input', (ev) => { patient.direccion = ev.target.value; render(); }); document.getElementById('dispSearch')?.addEventListener('input', (ev) => searchItems(ev.target.value)); document.querySelectorAll('[data-add-disp]').forEach((button) => button.addEventListener('click', () => { const item = suggestions.find((row) => Number(row.id_producto) === Number(button.dataset.addDisp)); if (item) addItem(item); })); document.querySelectorAll('[data-item-qty]').forEach((input) => input.addEventListener('input', (ev) => updateItem(Number(ev.target.dataset.itemQty), 'cantidad_solicitada', ev.target.value))); document.querySelectorAll('[data-item-dose]').forEach((input) => input.addEventListener('input', (ev) => updateItem(Number(ev.target.dataset.itemDose), 'dosis', ev.target.value))); document.querySelectorAll('[data-item-via]').forEach((input) => input.addEventListener('input', (ev) => updateItem(Number(ev.target.dataset.itemVia), 'via_administracion', ev.target.value))); document.querySelectorAll('[data-item-freq]').forEach((input) => input.addEventListener('input', (ev) => updateItem(Number(ev.target.dataset.itemFreq), 'frecuencia', ev.target.value))); document.querySelectorAll('[data-remove-item]').forEach((button) => button.addEventListener('click', () => { cart.splice(Number(button.dataset.removeItem), 1); render(); })); document.getElementById('confirmCheckout')?.addEventListener('click', saveManual); document.getElementById('importEhr')?.addEventListener('click', importEhr); document.getElementById('importScan')?.addEventListener('click', importScan); notifyParentHeight(); }
load().catch((error) => { app.innerHTML = `<div class="surface-card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
