<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de perfiles</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip primary">Seguridad</span><h1>Gestor de perfiles y roles</h1><p>Tarjetas por perfil, formulario de usabilidades en acordeones, adjudicación a usuarios y eliminación asistida con reasignación obligatoria cuando el perfil está en uso.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=profiles&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:profiles">Dashboard</a></div></div><div id="app"></div><script>
requireSession();
const { api, html, escapeHtml, notifyParentHeight, modalShell, toast, number } = window.akriOps;
const app = document.getElementById('app');
let ctx=null, lookups=null, profiles=[], users=[], form=blank(), selectedRole=null;
function blank(){ return { id_rol:null, nombre:'', descripcion:'', nivel_jerarquia:5, es_activo:true, usability_keys:[], permissions:{} }; }
const permissionOptions=[['perm_inventario_consulta','Inventario consulta'],['perm_inventario_movimiento','Movimiento inventario'],['perm_inventario_ajuste','Ajustes inventario'],['perm_compras_solicitar','Solicitar compras'],['perm_compras_aprobar','Aprobar compras'],['perm_compras_recibir','Recibir compras'],['perm_ventas_dispensar','Dispensar'],['perm_ventas_facturar','Facturar'],['perm_controlados_dispensar','Controlados'],['perm_cadena_frio_consulta','Cadena de frío'],['perm_reportes_operativos','Reportes'],['perm_configuracion','Configuración'],['perm_usuarios_gestionar','Gestionar usuarios'],['perm_auditoria_consulta','Auditoría']];
async function load(){ [ctx, lookups, profiles, users] = await Promise.all([api('/api/multisite/context'), api('/api/admin/lookups'), api('/api/admin/profiles'), api('/api/admin/users')]); if(selectedRole){ selectedRole = profiles.find((p)=> Number(p.id_rol)===Number(selectedRole.id_rol)) || null; } render(); }
function usabilityCatalog(){ return lookups.usability_catalog || []; }
function groupedCatalog(){ return Object.entries(usabilityCatalog().reduce((acc,item)=>{ (acc[item.categoria] ||= []).push(item); return acc; }, {})); }
async function editProfile(profile){ const usabilities = await api(`/api/admin/profiles/${profile.id_rol}/usabilities`).catch(()=>[]); form = { id_rol:Number(profile.id_rol), nombre:profile.nombre||'', descripcion:profile.descripcion||'', nivel_jerarquia:Number(profile.nivel_jerarquia||5), es_activo:Boolean(profile.es_activo), usability_keys:usabilities.filter((u)=>u.habilitado !== false).map((u)=>u.clave), permissions:Object.fromEntries(permissionOptions.map(([key])=> [key, Boolean(profile[key])])) }; render(); bindForm(); }
function resetForm(){ form = blank(); render(); bindForm(); }
async function saveProfile(){ try{ const payload = { nombre:form.nombre, descripcion:form.descripcion||null, nivel_jerarquia:Number(form.nivel_jerarquia||5), es_activo:Boolean(form.es_activo), ...Object.fromEntries(permissionOptions.map(([key])=> [key, Boolean(form.permissions[key])])) }; let saved; if(form.id_rol) saved = await api(`/api/admin/profiles/${form.id_rol}`, { method:'PUT', body: JSON.stringify(payload) }); else saved = await api('/api/admin/profiles', { method:'POST', body: JSON.stringify(payload) }); const roleId = saved.id_rol || form.id_rol; const items = usabilityCatalog().map((item)=> ({ ...item, habilitado:(form.usability_keys||[]).includes(item.clave) })); await api(`/api/admin/profiles/${roleId}/usabilities`, { method:'PUT', body: JSON.stringify({ items }) }); toast(form.id_rol ? 'Perfil actualizado' : 'Perfil creado', 'success'); resetForm(); await load(); } catch(error){ toast(error.message,'error',5200); } }
async function deleteProfile(profile){
  const assignedUsers = users.filter((u)=> Number(u.id_rol)===Number(profile.id_rol));
  const roleOptions = profiles.filter((row)=> Number(row.id_rol)!==Number(profile.id_rol) && row.es_activo).map((row)=> `<option value="${row.id_rol}">${escapeHtml(row.nombre)}</option>`).join('');
  const modal = modalShell(`
    <div class="modal-head"><div><span class="chip danger">Eliminar perfil</span><h2 style="margin:.35rem 0 0">${escapeHtml(profile.nombre)}</h2><div class="muted">${assignedUsers.length ? 'Debes reasignar los usuarios existentes antes de eliminarlo.' : 'No tiene usuarios asignados, se puede eliminar directamente.'}</div></div><button class="btn secondary" id="closeModal">Cerrar</button></div>
    ${assignedUsers.length ? `<div class="notice error">Este perfil está asignado a ${assignedUsers.length} usuario(s).</div><div class="form-grid" style="margin-top:14px"><div><label>Reasignar usuarios a</label><select id="reassignRole"><option value="">Selecciona un perfil</option>${roleOptions}</select></div></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Usuario</th><th>Sede</th></tr></thead><tbody>${assignedUsers.map((u)=> `<tr><td>${escapeHtml(u.nombre_completo || u.username)}</td><td>${escapeHtml(u.sede || '—')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="notice success">No hay usuarios asignados a este perfil.</div>'}
    <div class="toolbar" style="margin-top:18px"><button class="btn danger" id="confirmDelete">Eliminar perfil</button></div>`);
  modal.querySelector('#closeModal').onclick = ()=> modal.remove();
  modal.querySelector('#confirmDelete').onclick = async ()=>{ try{ const select = modal.querySelector('#reassignRole'); const params = select && select.value ? `?reassign_to=${encodeURIComponent(select.value)}` : ''; await api(`/api/admin/profiles/${profile.id_rol}${params}`, { method:'DELETE' }); toast('Perfil eliminado', 'success'); modal.remove(); await load(); } catch(error){ toast(error.message,'error',5200); } };
}
function bindForm(){ document.getElementById('profile-nombre').oninput=(e)=> form.nombre=e.target.value; document.getElementById('profile-descripcion').oninput=(e)=> form.descripcion=e.target.value; document.getElementById('profile-nivel').oninput=(e)=> form.nivel_jerarquia=e.target.value; document.getElementById('profile-activo').onchange=(e)=> form.es_activo=e.target.checked; permissionOptions.forEach(([key])=>{ const el=document.getElementById(`perm-${key}`); if(el) el.onchange=(e)=> form.permissions[key]=e.target.checked; }); document.querySelectorAll('[data-usability]').forEach((el)=> el.onchange=()=> form.usability_keys=[...document.querySelectorAll('[data-usability]:checked')].map(x=> x.value)); document.getElementById('saveProfile').onclick=saveProfile; document.getElementById('resetProfile').onclick=resetForm; document.querySelectorAll('.accordion-trigger').forEach((btn)=> btn.onclick=()=> btn.closest('.accordion-item').classList.toggle('open')); notifyParentHeight(); }
function openAssign(profile){ selectedRole = profile; render(); bindAssignment(); }
async function saveAssignment(){ const userId = Number(document.getElementById('assign-user').value || 0); if(!userId) return toast('Selecciona un usuario','error'); try{ const siteIds=[...document.querySelectorAll('[data-site-assign]:checked')].map((el)=> Number(el.value)); await api(`/api/admin/users/${userId}/assignment`, { method:'PATCH', body: JSON.stringify({ id_rol:Number(document.getElementById('assign-role').value), id_sede:Number(document.getElementById('assign-site').value), site_ids:siteIds, puede_admin_sede:document.getElementById('assign-admin').checked }) }); toast('Adjudicación guardada','success'); await load(); } catch(error){ toast(error.message,'error'); } }
function bindAssignment(){ document.getElementById('saveAssignment')?.addEventListener('click', saveAssignment); notifyParentHeight(); }
function render(){ if(!(ctx.permissions.can_manage_profiles || ctx.permissions.can_assign_profiles)){ app.innerHTML='<div class="card"><strong>Acceso restringido.</strong><p class="muted">Tu perfil no tiene habilitado el gestor de perfiles.</p></div>'; notifyParentHeight(); return; } const activeProfiles=profiles.filter((p)=>p.es_activo).length; app.innerHTML=html`
  <div class="grid four"><div class="stat-card"><small>Perfiles activos</small><strong>${number(activeProfiles)}</strong><div class="meta">Usos operativos</div></div><div class="stat-card"><small>Perfiles inactivos</small><strong>${number(profiles.length-activeProfiles)}</strong><div class="meta">Suspendidos</div></div><div class="stat-card"><small>Usuarios asignados</small><strong>${number(users.length)}</strong><div class="meta">Con perfil y sede</div></div><div class="stat-card"><small>Usabilidades catalogadas</small><strong>${number(usabilityCatalog().length)}</strong><div class="meta">Matriz configurable</div></div></div>
  <div class="grid two">
    <div class="card">
      <h2 class="section-title">${form.id_rol ? 'Editar perfil' : 'Crear perfil'}</h2>
      <div class="form-grid"><div><label>Nombre del rol</label><input id="profile-nombre" value="${escapeHtml(form.nombre)}" placeholder="Regente de Farmacia"></div><div><label>Nivel jerárquico</label><input id="profile-nivel" type="number" min="1" max="9" value="${escapeHtml(form.nivel_jerarquia)}"></div><div class="full"><label>Descripción</label><input id="profile-descripcion" value="${escapeHtml(form.descripcion)}"></div></div>
      <div class="switch-row"><label><input id="profile-activo" type="checkbox" ${form.es_activo ? 'checked' : ''}> Perfil activo</label></div>
      <h3 style="margin:18px 0 8px">Permisos granulares</h3><div class="inline-checks">${permissionOptions.map(([key,label])=> `<label><input type="checkbox" id="perm-${key}" ${form.permissions[key] ? 'checked' : ''}> ${escapeHtml(label)}</label>`).join('')}</div>
      <h3 style="margin:18px 0 8px">Usabilidades por módulo</h3><div class="accordion">${groupedCatalog().map(([category, items], index)=> `<div class="accordion-item ${index===0 ? 'open' : ''}"><button type="button" class="accordion-trigger">${escapeHtml(category)} <span class="muted">${items.length} funciones</span></button><div class="accordion-panel"><div class="inline-checks">${items.map((item)=> `<label title="${escapeHtml(item.descripcion || '')}"><input type="checkbox" data-usability value="${escapeHtml(item.clave)}" ${(form.usability_keys||[]).includes(item.clave) ? 'checked' : ''}> ${escapeHtml(item.nombre)}</label>`).join('')}</div></div></div>`).join('')}</div>
      <div class="toolbar" style="margin-top:14px"><button class="btn" id="saveProfile">Guardar perfil</button><button class="btn secondary" id="resetProfile">Limpiar</button></div>
    </div>
    <div class="card">
      <h2 class="section-title">Adjudicación de perfil</h2>
      <div class="muted">Selecciona un usuario, asigna el perfil y define sus sedes autorizadas.</div>
      <div class="form-grid" style="margin-top:14px"><div><label>Usuario</label><select id="assign-user"><option value="">Selecciona</option>${users.map((u)=> `<option value="${u.id_usuario}">${escapeHtml(u.nombre_completo || u.username)}</option>`).join('')}</select></div><div><label>Perfil</label><select id="assign-role">${profiles.filter((p)=>p.es_activo).map((p)=> `<option value="${p.id_rol}" ${selectedRole && Number(selectedRole.id_rol)===Number(p.id_rol) ? 'selected' : ''}>${escapeHtml(p.nombre)}</option>`).join('')}</select></div><div><label>Sede principal</label><select id="assign-site">${(lookups.sites||[]).map((s)=> `<option value="${s.id_sede}">${escapeHtml(s.nombre)}</option>`).join('')}</select></div><div><label style="display:flex;align-items:center;gap:8px;margin-top:28px"><input type="checkbox" id="assign-admin"> Admin de sede</label></div><div class="full"><label>Sedes autorizadas</label><div class="inline-checks">${(lookups.sites||[]).map((site)=> `<label><input type="checkbox" data-site-assign value="${site.id_sede}"> ${escapeHtml(site.nombre)}</label>`).join('')}</div></div></div>
      <div class="toolbar" style="margin-top:14px"><button class="btn accent" id="saveAssignment">Guardar adjudicación</button></div>
    </div>
  </div>
  <div class="cards-grid">${profiles.map((profile)=> `<article class="role-card"><header><div><span class="chip ${profile.es_activo ? 'success' : 'danger'}">${profile.es_activo ? 'Activo' : 'Inactivo'}</span><h3 style="margin:.55rem 0 .2rem">${escapeHtml(profile.nombre)}</h3><div class="count">${number(profile.usuarios_asignados||0)} usuario(s) asignados · Nivel ${number(profile.nivel_jerarquia)}</div></div><button class="btn secondary small" data-open-role="${profile.id_rol}">Adjudicar</button></header><div class="muted">${escapeHtml(profile.descripcion || 'Sin descripción')}</div><div class="card-actions"><button class="btn secondary small" data-edit-role="${profile.id_rol}">Editar</button>${profile.nombre === 'ADMINISTRADOR' ? '<span class="chip primary">Protegido</span>' : `<button class="btn danger small" data-del-role="${profile.id_rol}">Eliminar</button>`}</div></article>`).join('')}</div>`;
  document.querySelectorAll('[data-edit-role]').forEach((btn)=> btn.onclick=()=> editProfile(profiles.find((p)=> Number(p.id_rol)===Number(btn.dataset.editRole)))); document.querySelectorAll('[data-del-role]').forEach((btn)=> btn.onclick=()=> deleteProfile(profiles.find((p)=> Number(p.id_rol)===Number(btn.dataset.delRole)))); document.querySelectorAll('[data-open-role]').forEach((btn)=> btn.onclick=()=> openAssign(profiles.find((p)=> Number(p.id_rol)===Number(btn.dataset.openRole)))); bindForm(); bindAssignment(); }
load().catch((error)=>{ app.innerHTML = `<div class="card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
