<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trazabilidad terminada</title><link rel="stylesheet" href="./ops.css"></head><body><script src="./ops-runtime.js?v=26"></script><div class="wrap"><div class="hero"><div><span class="chip success">Trazabilidad</span><h1>Quién hizo qué, con qué perfil y en qué sede</h1><p>Barra de búsqueda avanzada, tabla de solo lectura, visor tipo diff y exportación del reporte auditado.</p></div><div class="toolbar"><a class="btn secondary" href="./index.html?tab=traceability&v=26">Centro de control</a><a class="btn secondary" href="/dashboard#control-center:traceability">Dashboard</a></div></div><div id="app"></div><div class="modal-backdrop" id="diffModal"><div class="modal"><div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="chip primary">Diff Viewer</span><h2 style="margin:8px 0 0">Detalle del cambio</h2></div><button class="btn secondary small" id="closeDiffModal">Cerrar</button></div><div id="diffModalBody" style="margin-top:14px"></div></div></div><script>
requireSession();
const { api, html, escapeHtml, formatDate, downloadCsv, downloadText, printHtml, notifyParentHeight } = window.akriOps;
const app = document.getElementById('app');
const diffModal = document.getElementById('diffModal');
const diffBody = document.getElementById('diffModalBody');
let rows = [], lookups = null; let filters = { from:'', to:'', site:'', user:'', action:'', search:'' };
async function load(){ [rows, lookups] = await Promise.all([ api('/api/traceability/processes?limit=400'), api('/api/admin/lookups').catch(()=>({sites:[],roles:[]})) ]); render(); }
function withinRange(dateString){ const d = new Date(dateString); if(filters.from && d < new Date(filters.from + 'T00:00:00')) return false; if(filters.to && d > new Date(filters.to + 'T23:59:59')) return false; return true; }
function filteredRows(){ return rows.filter((row)=>{ if(filters.site && Number(row.id_sede)!==Number(filters.site)) return false; if(filters.user && String(row.usuario || '').toLowerCase() !== String(filters.user).toLowerCase()) return false; if(filters.action && String(row.proceso || '').toLowerCase() !== String(filters.action).toLowerCase()) return false; if(filters.search && !JSON.stringify(row).toLowerCase().includes(filters.search.toLowerCase())) return false; if(!withinRange(row.fecha_hora)) return false; return true; }); }
function uniqueUsers(){ return [...new Set(rows.map((row)=>row.usuario).filter(Boolean))].sort(); }
function uniqueActions(){ return [...new Set(rows.map((row)=>row.proceso).filter(Boolean))].sort(); }
function showDiff(row){ const payload = row.payload_json || {}; const before = payload.before || null; const after = payload.after || null; diffBody.innerHTML = before || after ? `<div class="split-view"><div class="panel"><h3 style="margin-top:0;color:#B91C1C">Valor anterior</h3><pre style="white-space:pre-wrap">${escapeHtml(JSON.stringify(before || {}, null, 2))}</pre></div><div class="panel"><h3 style="margin-top:0;color:#047857">Valor nuevo</h3><pre style="white-space:pre-wrap">${escapeHtml(JSON.stringify(after || payload, null, 2))}</pre></div></div>` : `<pre style="white-space:pre-wrap">${escapeHtml(JSON.stringify(payload || {}, null, 2))}</pre>`; diffModal.classList.add('open'); notifyParentHeight(); }
function closeDiff(){ diffModal.classList.remove('open'); }
function exportCurrent(type){ const current = filteredRows(); const columns = [{key:'fecha_hora',label:'Fecha/Hora'},{key:'usuario',label:'Usuario'},{key:'perfil_nombre',label:'Perfil activo'},{key:'sede',label:'Sede'},{key:'proceso',label:'Acción/Módulo'},{key:'descripcion',label:'Detalle'}]; if(type==='csv') return downloadCsv('trazabilidad.csv', current, columns); if(type==='json') return downloadText('trazabilidad.json', JSON.stringify(current, null, 2), 'application/json;charset=utf-8'); printHtml('Trazabilidad', `<h1>Trazabilidad / Logs</h1><table><thead><tr>${columns.map((col)=>`<th>${escapeHtml(col.label)}</th>`).join('')}</tr></thead><tbody>${current.map((row)=>`<tr>${columns.map((col)=>`<td>${escapeHtml(row[col.key] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`); }
function render(){ const current = filteredRows(); app.innerHTML = html`
  <div class="sticky-filter"><div class="card tight" style="width:100%"><div class="audit-filter"><div><label>Desde</label><input id="filterFrom" type="date" value="${escapeHtml(filters.from)}"></div><div><label>Hasta</label><input id="filterTo" type="date" value="${escapeHtml(filters.to)}"></div><div><label>Sede</label><select id="filterSite"><option value="">Todas</option>${(lookups?.sites || []).map((site)=>`<option value="${site.id_sede}" ${String(filters.site)===String(site.id_sede)?'selected':''}>${escapeHtml(site.nombre)}</option>`).join('')}</select></div><div><label>Usuario</label><select id="filterUser"><option value="">Todos</option>${uniqueUsers().map((user)=>`<option value="${escapeHtml(user)}" ${filters.user===user?'selected':''}>${escapeHtml(user)}</option>`).join('')}</select></div><div><label>Acción</label><select id="filterAction"><option value="">Todas</option>${uniqueActions().map((action)=>`<option value="${escapeHtml(action)}" ${filters.action===action?'selected':''}>${escapeHtml(action)}</option>`).join('')}</select></div><div style="min-width:260px;flex:1 1 260px"><label>Búsqueda</label><input id="filterSearch" value="${escapeHtml(filters.search)}" placeholder="Referencia, endpoint, detalle"></div><div class="toolbar"><button class="btn secondary" data-export="csv">CSV</button><button class="btn secondary" data-export="json">JSON</button><button class="btn secondary" data-export="pdf">PDF</button></div></div></div></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Fecha/Hora</th><th>Usuario</th><th>Perfil activo</th><th>Sede</th><th>Acción/Módulo</th><th>Detalle</th><th>Ver</th></tr></thead><tbody>${current.map((row)=>`<tr><td>${escapeHtml(formatDate(row.fecha_hora))}</td><td>${escapeHtml(row.usuario || '—')}</td><td>${escapeHtml(row.perfil_nombre || '—')}</td><td>${escapeHtml(row.sede || '—')}</td><td>${escapeHtml(row.proceso || '—')}<div class="muted">${escapeHtml(row.subproceso || '—')}</div></td><td>${escapeHtml(row.descripcion || '—')}</td><td><button class="btn secondary small" data-diff="${row.id_traza}">Ver cambio</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">Sin registros.</td></tr>'}</tbody></table></div></div>`;
  [['filterFrom','from'],['filterTo','to'],['filterSite','site'],['filterUser','user'],['filterAction','action'],['filterSearch','search']].forEach(([id,key])=>document.getElementById(id)?.addEventListener('input',(e)=>{ filters[key]=e.target.value; render(); })); document.querySelectorAll('[data-export]').forEach((b)=>b.addEventListener('click',()=>exportCurrent(b.dataset.export))); document.querySelectorAll('[data-diff]').forEach((b)=>b.addEventListener('click',()=>{ const row = rows.find((item)=>Number(item.id_traza)===Number(b.dataset.diff)); if(row) showDiff(row); })); document.getElementById('closeDiffModal')?.addEventListener('click', closeDiff); notifyParentHeight(); }
load().catch((error)=>{ app.innerHTML = `<div class="card"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`; notifyParentHeight(); });
</script></body></html>
